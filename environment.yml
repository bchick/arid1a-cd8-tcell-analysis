# Command-line tools used outside the nf-core containers.
#   conda env create -f environment.yml && conda activate arid1a-cd8
# R packages are pinned separately in renv.lock (renv::restore()).
name: arid1a-cd8
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pandas
  - markdown
  - nextflow=25.10.0
  - deeptools=3.5.4
  - homer=5.1
  - meme=5.5.4
  - tobias=0.16.1
  - macs2=2.2.9.1
  - bedtools=2.30.0
  - samtools
  - ucsc-bedgraphtobigwig
