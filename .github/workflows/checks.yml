name: checks

# Lightweight checks that need no data bundle: repository hygiene, and that
# every R, shell and Python script at least parses. The full analysis is
# verified with `make fetch-data all validate` (see README).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Release hygiene (no absolute paths, secrets or stray files)
        run: python3 tools/validate_release.py --skip bundle results

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: R scripts parse
        run: |
          git ls-files '*.R' | while read -r f; do
            Rscript --vanilla -e "invisible(parse('$f'))" || { echo "::error file=$f::R parse failed"; exit 1; }
          done
      - name: Shell scripts (bash -n, shellcheck errors)
        run: |
          git ls-files '*.sh' | xargs -n1 bash -n
          git ls-files '*.sh' | xargs shellcheck -S error
      - name: Python scripts compile
        run: git ls-files '*.py' | xargs python3 -m py_compile
